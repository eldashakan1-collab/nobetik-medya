<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
FONTCSS
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05070f}
.scene{position:absolute;inset:0;overflow:hidden}
.img{position:absolute;left:0;top:0;transform-origin:0 0}
.cap{position:absolute;left:50%;top:200px;transform:translateX(-50%);background:rgba(0,0,0,.46);border-radius:28px;padding:26px 40px;font-family:Inter,sans-serif;font-weight:800;color:#fff;font-size:54px;line-height:1.22;text-align:center;white-space:pre;opacity:0}
.note{position:absolute;left:252px;top:562px;width:116px;height:84px;transform:rotate(-6deg) scale(0);background:linear-gradient(160deg,#fbe98a,#f2d75e);box-shadow:0 4px 8px rgba(0,0,0,.45);font-family:Caveat;font-weight:700;font-size:17px;line-height:1.05;color:#2b2414;text-align:center;padding-top:12px;box-sizing:border-box;white-space:pre}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#title,#end{position:absolute;inset:0;background:#0B1430;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Inter,sans-serif;text-align:center}
#mini{position:absolute;right:60px;bottom:330px;background:rgba(0,0,0,.5);border-radius:22px;padding:14px 30px;font-family:Inter;font-weight:900;font-size:56px;color:#FBBF24;opacity:0}
</style></head>
<body>
<div class="scene" id="sA"><div class="img" id="iA" style="width:1792px;height:1008px"><img src="IMGA" style="width:1792px;height:1008px;display:block"></div></div>
<div class="scene" id="sB"><div class="img" id="iB" style="width:844px;height:736px"><img src="IMGB" style="width:844px;height:736px;display:block"><div class="note" id="note">31 ARALIK
DEFNE İZİNLİ ♡</div></div></div>
<div id="vig"></div>
<div class="cap" id="cap"></div>
<div id="mini">03:17</div>
<div id="title">
  <div style="font-weight:700;font-size:34px;color:#93C5FD;letter-spacing:8px">GECE NÖBETİ · BÖLÜM 2</div>
  <div style="font-weight:900;font-size:250px;color:#FBBF24;letter-spacing:-6px;line-height:1;margin-top:40px">03:17</div>
  <div id="tsub" style="font-family:Fraunces;font-style:italic;font-size:74px;color:#E0E7FF;margin-top:40px;opacity:0">Aynı gece, iki masa.</div>
</div>
<div id="end" style="opacity:0">
  <div style="font-weight:700;font-size:34px;color:#93C5FD;letter-spacing:8px">GECE 03:17</div>
  <div style="font-weight:900;font-size:88px;color:#fff;margin-top:46px;line-height:1.1">Senin listeni<br><span style="color:#FBBF24">kim hazırlıyor?</span></div>
  <div style="font-weight:500;font-size:40px;color:#CBD5E1;margin-top:40px">Ona bir teşekkür bırak, etiketle.</div>
  <img src="LOGO" style="height:36px;margin-top:110px;opacity:.75">
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const seg=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
// camera keyframes [t0,t1,[cx,cy,s] start, end]
const camA=[[2.5,9.0,[420,504,1.905],[820,504,2.0]],[15.0,19.5,[860,430,2.4],[875,385,2.75]],[25.0,28.6,[870,450,2.3],[900,504,1.95]]];
const camB=[[9.0,15.0,[470,368,2.61],[440,345,2.85]],[19.5,25.0,[420,440,2.9],[330,470,3.6]]];
function cam(list,t){for(const k of list){if(t>=k[0]-0.5&&t<=k[1]+0.5){const x=ease(seg(t,k[0],k[1]));return k[2].map((v,i)=>lerp(v,k[3][i],x))}}return null}
function place(el,c){if(!c)return;const [cx,cy,s]=c;el.style.transform=`translate(${540-cx*s}px,${960-cy*s}px) scale(${s})`}
const caps=[[2.8,5.8,'03:17. Serviste Defne.'],[5.8,9.0,'Dosyalar, takipler…\nbitmeyen bir gece.'],[9.3,12.0,'Aynı saatte, aynı hastane:\nsorumlu hemşire Selin.'],[12.0,15.0,'Masada Aralık nöbet listesi.\nÜçüncü kez baştan.'],[15.3,19.5,'Defne bilmiyor ama listede\nonun için bir satır var.'],[20.8,25.0,'İlk kez Yılbaşı\'nda\nevde olacak.'],[25.3,28.5,'Görülmeyen emek bazen\nbir listede görünür.']];
function setT(t){
 $('title').style.opacity=1-seg(t,2.2,2.6);
 $('tsub').style.opacity=ease(seg(t,1.0,1.6));
 // scene visibility (crossfades)
 const inB=(t>=9.0&&t<15.0)||(t>=19.5&&t<25.0);
 let oB=0; for(const [a,b] of [[9.0,15.0],[19.5,25.0]]){ if(t>=a-0.2&&t<b+0.2){oB=Math.max(oB,Math.min(seg(t,a-0.2,a+0.2),1-seg(t,b-0.2,b+0.2)))} }
 $('sB').style.opacity=oB; $('sA').style.opacity=1;
 place($('iA'),cam(camA,t)); place($('iB'),cam(camB,t));
 // note pop
 const np=seg(t,20.1,20.5); const s=np<1?ease(np)*1.12:1-0.12*seg(t,20.5,20.7)+0.12;
 $('note').style.transform=`rotate(-6deg) scale(${t<20.1?0:Math.min(1.12,s)})`;
 // captions
 const c=caps.find(k=>t>=k[0]&&t<k[1]);
 if(c){$('cap').textContent=c[2];$('cap').style.opacity=Math.min(seg(t,c[0],c[0]+.25),1-seg(t,c[1]-.2,c[1]))}else $('cap').style.opacity=0;
 $('mini').style.opacity=(t>2.6&&t<19.5)?1:0;
 $('end').style.opacity=ease(seg(t,28.4,28.8));
}
window.setT=setT; setT(0);
</script>
</body></html>

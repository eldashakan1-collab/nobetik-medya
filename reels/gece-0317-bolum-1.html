    <!-- Can (stajyer, standing) -->

  <!-- bubbles -->

  </g>
  <!-- caption -->
  <g id="capg" opacity="0"><rect id="capbg" x="70" y="200" width="940" height="150" rx="28" fill="#000000" opacity="0.38"/>

    <text id="miniT" x="895" y="1588" text-anchor="middle" font-family="Inter" font-weight="900" font-size="58" fill="#FBBF24">03:18</text></g>
  <!-- title card -->
  <g id="title">
    <rect width="1080" height="1920" fill="#0B1430"/>
    <text x="540" y="760" text-anchor="middle" font-family="Inter" font-weight="700" font-size="34" fill="#93C5FD" letter-spacing="8">GECE NÖBETİ · BÖLÜM 1</text>
    <text id="tclock" x="540" y="1010" text-anchor="middle" font-family="Inter" font-weight="900" font-size="250" fill="#FBBF24" letter-spacing="-6">03:17</text>
    <text id="tsub" x="540" y="1130" text-anchor="middle" font-family="Fraunces" font-style="italic" font-size="76" fill="#E0E7FF" opacity="0">Sakin bir gece.</text>
  </g>
  <!-- end card -->
  <g id="end" opacity="0">
    <rect width="1080" height="1920" fill="#0B1430"/>
    <text x="540" y="780" text-anchor="middle" font-family="Inter" font-weight="700" font-size="34" fill="#93C5FD" letter-spacing="8">GECE 03:17</text>
    <text x="540" y="930" text-anchor="middle" font-family="Inter" font-weight="900" font-size="92" fill="#FFFFFF">Senin servisinde</text>
    <text x="540" y="1040" text-anchor="middle" font-family="Inter" font-weight="900" font-size="92" fill="#FBBF24">yasaklı kelime ne?</text>
    <text x="540" y="1160" text-anchor="middle" font-family="Inter" font-weight="500" font-size="40" fill="#CBD5E1">Yorumlara yaz, nöbet arkadaşını etiketle.</text>
    <image href="LOGO" x="465" y="1290" width="150" height="39" opacity="0.75"/>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const seg=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
function hex(c){return [1,3,5].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,x){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],x))).join(',')+')'}
// bells
const bells=$('bells');let bh='';
for(let r=0;r<3;r++)for(let c=0;c<4;c++){const i=r*4+c,x=640+c*90,y=505+r*75;
 bh+=`<circle id="bl${i}" cx="${x}" cy="${y}" r="24" fill="#26365E"/><text x="${x}" y="${y+9}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="24" fill="#94A3B8">${i+1}</text>`}
bells.innerHTML=bh;
const caps=[[2.8,5.2,'Servis sessiz.'],[5.2,8,'Monitörler sakin. Çay hâlâ sıcak.'],[13.6,15.4,'03:18 — 7 numara zil çaldı.'],[15.4,17.2,'03:19 — 12 numara da.'],[17.2,19.8,'03:26 — Hepsi.'],[20.6,23,'07:59. Herkes iyi.'],[23,25.6,'Sadece biri artık bir şeyi biliyor.']];
function ecg(t,busy){let d='';const x0=575,w=210,y0=1010;
 for(let i=0;i<=70;i++){const x=x0+w*i/70;const ph=((i/70)*(busy?4:1.3)+t*(busy?3:0.8))%1;
  let y=y0; if(ph>.45&&ph<.5)y-=busy?70:40; else if(ph>=.5&&ph<.55)y+=busy?40:18; else if(ph>.3&&ph<.38)y-=8;
  if(busy)y+=Math.sin(i*1.7+t*20)*6; d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
 return d}
function setT(t){
 // title
 const tOut=1-seg(t,2.2,2.6); $('title').setAttribute('opacity',tOut);
 $('tsub').setAttribute('opacity',ease(seg(t,1.0,1.6)));
 // camera
 let sc=1+0.08*ease(seg(t,11.5,12.6))-0.08*ease(seg(t,13.3,13.9));
 let sx=0,sy=0; if(t>13.6&&t<19.8){sx=Math.sin(t*55)*6;sy=Math.cos(t*47)*5}
 $('cam').setAttribute('transform',`translate(${540+sx} ${700+sy}) scale(${sc*1.18}) translate(-540 -700)`);
 // morning
 const m=ease(seg(t,20,21.5));
 $('sky').setAttribute('fill',mix('#14224A','#FDBA74',m));
 $('moon').setAttribute('opacity',1-m);
 $('sun').setAttribute('opacity',m); $('sun').setAttribute('cy',lerp(900,700,m));
 $('tint').setAttribute('opacity',lerp(0.18,0,m));
 $('simit').setAttribute('opacity',m);
 // tea steam
 const st=t<11.5||t>20; ['steam1','steam2'].forEach((s,k)=>{$(s).setAttribute('opacity',st?0.35+0.35*Math.sin(t*3+k):0);$(s).setAttribute('transform',`translate(0 ${-((t*20+k*15)%20)})`)});
 // ecg
 const busy=t>13.6&&t<20; $('ecg').setAttribute('d',ecg(t,busy));
 $('bpm').textContent=busy?String(118+Math.floor((t*7)%9)):'72';
 // bells
 for(let i=0;i<12;i++){const on=t>13.6&&t<20&&(t-13.6)>[6,11,0,3,8,1,10,4,7,2,9,5][i]*0.42;
  const blink=on&&Math.floor(t*6+i)%2===0;
  $('bl'+i).setAttribute('fill',on?(blink?'#EF4444':'#B91C1C'):'#26365E')}
 // Can enters
 const ce=ease(seg(t,8,9)); const cx=lerp(1260,878,ce);
 const slump=ease(seg(t,20,21.5))*40;
 $('can').setAttribute('transform',`translate(${cx} ${985+slump})`);
 $('cMouth').setAttribute('d', t>11.6&&t<20 ? 'M-16 -26 Q0 -40 16 -26' : 'M-20 -30 Q0 -14 20 -30');
 // Defne eyes
 const wide=t>11.6&&t<13.6; const ry=wide?9.5:7.5, rx=wide?8.5:6.5;
 ['dEl','dEr'].forEach(e=>{$(e).setAttribute('ry',ry);$(e).setAttribute('rx',rx)});['dWl','dWr'].forEach(e=>{$(e).setAttribute('ry',wide?15:10);$(e).setAttribute('rx',wide?16:14)});
 const smile=t>26.2; const tired=t>20&&!smile;
 $('dMouth').setAttribute('d', wide?'M318 1036 Q330 1024 342 1036 Q330 1046 318 1036':(tired?'M314 1034 L346 1034':(smile?'M308 1026 Q330 1050 352 1026':'M312 1030 Q330 1040 348 1030')));
 $('defne').setAttribute('transform',`translate(0 ${t>20?ease(seg(t,20,21.5))*18:0})`);
 // bubbles
 $('b1').setAttribute('opacity',ease(seg(t,9.2,9.5))*(1-seg(t,11.3,11.5)));
 $('b2').setAttribute('opacity',ease(seg(t,25.7,26))*(1-seg(t,28.3,28.5)));
 // captions
 let c=caps.find(k=>t>=k[0]&&t<k[1]);
 if(c){$('cap').textContent=c[2];const a=Math.min(seg(t,c[0],c[0]+.25),1-seg(t,c[1]-.2,c[1]));$('capg').setAttribute('opacity',a);
  const w=Math.min(960,c[2].length*31+120);$('capbg').setAttribute('x',540-w/2);$('capbg').setAttribute('width',w)} else $('capg').setAttribute('opacity',0);
 // big
 let big='',ba=0; if(t>=11.7&&t<12.4){big='…';ba=seg(t,11.7,11.9)} else if(t>=12.4&&t<13.6){big='O kelimeyi söyledi.';ba=Math.min(seg(t,12.4,12.6),1-seg(t,13.4,13.6))}
 $('big').textContent=big;$('big').setAttribute('opacity',ba);
 // mini clock
 const mc=t>13.6&&t<20; $('mini').setAttribute('opacity',mc?1:0);
 if(mc){const mins=t<15.4?18:(t<17.2?19:26+Math.floor(Math.pow(seg(t,17.2,19.8),2)*(478-26)));const h=3+Math.floor(mins/60),mm=mins%60;$('miniT').textContent='0'+h+':'+String(mm).padStart(2,'0')}
 // end
 $('end').setAttribute('opacity',ease(seg(t,28.4,28.8)));
}
window.setT=setT; setT(0);
</script>

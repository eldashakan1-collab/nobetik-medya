<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const seg=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
function hex(c){return [1,3,5].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,x){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],x))).join(',')+')'}
// bells
const bells=$('bells');let bh='';
for(let r=0;r<3;r++)for(let c=0;c<4;c++){const i=r*4+c,x=640+c*90,y=505+r*75;
 bh+=`<circle id="bl${i}" cx="${x}" cy="${y}" r="24" fill="#26365E"/><text x="${x}" y="${y+9}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="24" fill="#94A3B8">${i+1}</text>`}
bells.innerHTML=bh;
const caps=[[2.7,6.2,'03:17. Nihayet yemek molası.'],[6.2,9.0,'İlk lokma…'],[9.0,10.6,'…5 numara.'],[10.6,13.0,'Yemek bekleyebilir.'],[13.0,15.4,'03:41. Tekrar deneyelim.'],[15.4,16.6,'9 numara.'],[16.6,19.2,'Sarma soğudu. Çay soğudu.'],[19.6,22.6,'05:10. Kimse kıpırdamıyor…'],[22.8,25.4,'06:52. Gece yemeği servis edildi.']];
function ecg(t,busy){let d='';const x0=892,w=136,y0=1010;
 for(let i=0;i<=60;i++){const x=x0+w*i/60;const ph=((i/60)*1.3+t*0.8)%1;
  let y=y0; if(ph>.45&&ph<.5)y-=36; else if(ph>=.5&&ph<.55)y+=16; else if(ph>.3&&ph<.38)y-=7;
  d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
 return d}
// presence: 1 = at station, 0 = away. Leaves at 9.3 and 16.0, returns 13.0 and 19.2
function pres(t){ if(t<9.3)return 1; if(t<9.9)return 1-ease(seg(t,9.3,9.9)); if(t<12.8)return 0; if(t<13.4)return ease(seg(t,12.8,13.4)); if(t<16.0)return 1; if(t<16.6)return 1-ease(seg(t,16.0,16.6)); if(t<19.0)return 0; return ease(seg(t,19.0,19.6)) }
function setT(t){
 $('title').setAttribute('opacity',1-seg(t,2.2,2.6));
 $('tsub').setAttribute('opacity',ease(seg(t,1.0,1.6)));
 let sc=1+0.06*ease(seg(t,19.6,21))-0.06*ease(seg(t,22.4,23.2));
 $('cam').setAttribute('transform',`translate(540 700) scale(${sc*1.18}) translate(-620 -700)`);
 const m=ease(seg(t,22.6,24));
 $('sky').setAttribute('fill',mix('#14224A','#FDBA74',m)); $('moon').setAttribute('opacity',1-m);
 $('sun').setAttribute('opacity',m); $('sun').setAttribute('cy',lerp(900,700,m));
 $('tint').setAttribute('opacity',lerp(0.18,0,m)); $('simit').setAttribute('opacity',0);
 // steam: tea & food hot until 16.6, then cold
 const hot=t<16.6; const hf=hot?1:1-seg(t,16.6,17.6);
 ['steam1','steam2','fsteam1','fsteam2'].forEach((s,k)=>{$(s).setAttribute('opacity',(0.35+0.3*Math.sin(t*3+k))*hf);$(s).setAttribute('transform',`translate(0 ${-((t*20+k*15)%20)})`)});
 $('ecg').setAttribute('d',ecg(t,false)); $('bpm').textContent='72';
 // bells: 5 (idx4) 9.0-10.6 ; 9 (idx8) 15.4-16.6
 for(let i=0;i<12;i++){let on=(i===4&&t>9.0&&t<10.6)||(i===8&&t>15.4&&t<16.6);const blink=on&&Math.floor(t*6)%2===0;
  $('bl'+i).setAttribute('fill',on?(blink?'#EF4444':'#B91C1C'):'#26365E')}
 // characters
 const p=pres(t);
 const canIn=ease(seg(t,3.6,4.6)); const sit=ease(seg(t,6.0,6.8))*(t<9.3?1:0)+ (t>=13.0&&t<16.0?1:0)+ (t>=19.2?ease(seg(t,19.2,19.8)):0);
 const cx=lerp(1260,780,canIn)-(1-p)*520*(t>4.6?1:0);
 $('can').setAttribute('transform',`translate(${cx} ${985+Math.min(1,sit)*95})`);
 $('can').setAttribute('opacity',t>4.6?p:1);
 $('defne').setAttribute('transform',`translate(${-(1-p)*420} 0)`); $('defne').setAttribute('opacity',p);
 // expressions
 const startled=(t>9.0&&t<9.4)||(t>15.4&&t<15.9); const look=t>19.8&&t<22.6;
 ['dEl','dEr'].forEach(e=>{$(e).setAttribute('ry',startled?9.5:7.5);$(e).setAttribute('rx',startled?8.5:6.5);$(e).setAttribute('cy',look?986:991)});['dWl','dWr'].forEach(e=>{$(e).setAttribute('ry',startled?15:10);$(e).setAttribute('rx',startled?16:14)});
 $('dMouth').setAttribute('d', startled?'M318 1036 Q330 1024 342 1036 Q330 1046 318 1036':(t>23?'M308 1026 Q330 1050 352 1026':'M312 1030 Q330 1040 348 1030'));
 $('cMouth').setAttribute('d', startled?'M-12 -24 Q0 -40 12 -24 Q0 -16 -12 -24':(look?'M-16 -28 L16 -28':'M-20 -30 Q0 -14 20 -30'));
 // bubbles
